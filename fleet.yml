# Shinkiro — manifeste de flotte : LE JUGEMENT
#
# Ce fichier est écrit à la main et n'est jamais généré. Il porte ce qu'aucune
# API ne sait dire : à quoi sert un composant, dans quel ordre le construire, ce
# à quoi il faut faire attention.
#
# Les FAITS vivent dans fleet.lock.yml, régénéré par `make releve` : volumétrie,
# topics, licence effective, branche, artefacts de déploiement, commits sur 90 j.
# Un fichier qui prétend énoncer des faits doit les recalculer, sinon il ment.
#
# La tension entre les deux EST l'audit. Trois champs d'ici sont des jugements
# que le .lock peut contredire, et cette contradiction est un signal de dérive :
#
#   vitalite: actif        contredit par  commits_90j: 0
#   licence: mit           contredit par  licence: ABSENTE
#   deploiement.mode       contredit par  artefacts (mode vercel sans next.config)
#
# etage
#   reference  composant autonome : son dépôt, son cycle, son déploiement.
#   verse      outil léger : dépôt propre + submodule sous tools/.
#
# maturite   produit | utilisable | partiel | a-qualifier | gele
# vitalite   actif | gele | fige | relance-prioritaire   (commits sur 90 j)
#
# deploiement.mode — constaté, pas supposé :
#   coolify   compose piloté par Coolify sur le VPS (Traefik + TLS par FQDN)
#   systemd   unité .service installée sur l'hôte
#   docker    Dockerfile autonome, orchestration libre
#   vercel    application Next en PaaS
#   pages     statique servi par GitHub Pages
#   statique  HTML ouvrable sans serveur
#   document  ni service ni page : méthode, gabarits, doctrine
#   module    ne se déploie pas seul, passe par son hôte
#
# deploiement.racine — sous-dossier du point d'entrée quand il n'est pas à la
# racine. Trois composants sont dans ce cas ; sans ce champ, un agent les croit
# non déployables.

owner: xtincell
version: 2
programme: shinkiro        # ce dépôt-ci : il porte le manifeste, il n'y figure pas
plateforme_vps: coolify        # galahad patrouille et purge ses images ;
                               # hermes-cockpit s'y déploie ; galahad porte une
                               # skill diagnostic-coolify.json

# ── la présentation ─────────────────────────────────────────────────────
# Le portail n'est PAS un composant : il n'a pas de dépôt à lui, il vit dans
# celui-ci. L'inscrire parmi les composants ferait chercher un dépôt « portail »
# à la moitié des signaux, et ils répondraient à côté.
#
# Il est généré depuis fleet.yml, fleet.lock.yml et docs/ — un portail écrit à
# la main serait faux la semaine suivante, ce qui est la maladie même que ce
# dépôt combat. Sa fraîcheur est tenue par le signal portail-perime, qui compare
# l'empreinte des sources inscrite dans site/source.json à celle du manifeste.
presentation:
  racine: portail
  generateur: portail/construire.mjs
  sortie: portail/site
  entree: index.html
  deploiement: {mode: coolify, compose: portail/docker-compose.yml, image: "nginx:1.27-alpine"}
  donnees: {livrables: portail/donnees/livrables.json, extracteur: portail/extraire-livrables.mjs}
  lit: [fleet.yml, fleet.lock.yml, "docs/*.md", "docs/adr/SHK-*.md", scripts/signaux-flotte.mjs, docs/PORTFOLIO.md]

composants:

  # ── couche 01 · méthode ────────────────────────────────────────────────
  - nom: ADVE-project
    couche: method
    etage: reference
    maturite: produit
    licence: proprietaire
    vitalite: actif
    ordre_construction: 5
    deploiement: {mode: coolify, url: "https://powerupgraders.com/lafusee"}
    stack: [next, prisma, typescript, storybook, playwright]
    produits_portefeuille: ["07 · Creative Transformation Program", "02 · Creative Operations Audit"]
    source_partagee: {produit: argos, role: client, via: "POST /api/v1/ingest/dossier"}   # SHK-0002
    description: >-
      La Fusée — patrimoine de marque, stratégie, actifs et opérations, et dépôt
      canonique de la méthode ADVE. Sources, travail manuel et assistance
      facultative partagent les mêmes dossiers et décisions gouvernées.
    attention: >-
      Le plus lourd et le plus strict du programme. La présence d'un outil au
      registre ne prouve pas sa disponibilité. Raccords de suivi reçus ; corpus,
      cycles métier et promesses des autres sections publiques restent à recevoir.
      Une reprise conserve la tâche et son reçu ; un ticket résolu ne prouve pas
      la livraison. Contexte d'équipe administrateur, campagnes avant tâche et
      sélection par nom reçus ; mutations d'actions éprouvées localement. Rôle
      opérateur natif distinct, brouillons après remontage et versions restent ouverts.

  - nom: la-fusee-blueprint
    couche: method
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: gele
    deploiement: {mode: statique, racine: views, entree: LA_FUSEE_PHILO_VIEW.html}
    description: >-
      Corpus conceptuel et cahier des charges présents. Leurs engagements
      gouvernent l'élaboration de marque sans prouver l'implémentation.
    manque: >-
      Vue historique explicitée et accès clavier corrigés sur contrats DOM.
      Régénération du schéma, réception native et révision de méthode appliquée
      à une décision métier ouvertes. Voir docs/RECEPTION-METHODE-MARQUE.md.
    attention: Doctrine, pas code. Ne pas chercher à l'exécuter.

  - nom: indice-maturite
    couche: method
    etage: verse
    maturite: produit
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: pages, url: "https://xtincell.github.io/indice-maturite/", entree: index.html}
    produits_portefeuille: ["01 · Creative Opportunity Check"]
    description: >-
      Le diagnostic déclaratif d'entrée. Couverture explicite, bilan conservable
      et reprise manuelle ; une réponse manquante ne devient pas une note globale.
    attention: >-
      Le bilan exporté reste une source à admettre dans le dossier de marque.
      Son export ne reçoit ni une performance commerciale ni une décision.

  - nom: market-expansion-system
    couche: method
    etage: verse
    maturite: produit
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: document}
    produits_portefeuille: ["06 · Content Expansion Modules"]
    description: >-
      Décliner une campagne d'un marché à N marchés sans perdre la marque.
      Quatre types d'écart autorisés — langue, marque, SKU, réglementaire.
      Preuve terrain : neuf marchés, bascule de marque et de langue au Ghana.
    voir_aussi: >-
      la-barre implémente déjà la matrice support × marché (app/vue-matrice.js)
      et une taxonomie d'écarts complémentaire (app/ecarts.js, cinq origines :
      qui doit la reprise et si elle se facture). Les deux modèles ne sont pas
      reliés — c'est un chantier ouvert, pas un doublon.

  # ── couche 02 · entreprise ─────────────────────────────────────────────
  - nom: galahad-landing
    couche: company
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: docker, entree: index.html}
    description: Page produit de galahad. Dockerfile plus un index.html.
    attention: >-
      Le « à trancher » est tranché, et par le fichier lui-même : zéro occurrence
      de Shinkiro, d'ADVE, de La Fusée, de Radar ou de La Barre ; 26 de « agent »,
      10 de « VPS », 8 de « Telegram ». C'est bien la page de galahad.
      Mais elle s'adresse au MAUVAIS ACHETEUR — « self-hosted team of autonomous
      AI agents », « self-host in 60 seconds », écrit pour un développeur qui
      veut auto-héberger. Le produit s'adresse à un patron d'agence qui veut que
      sa boîte tourne sans lui. Elle vend la technologie au lieu du résultat,
      ce que la règle de nommage du portefeuille interdit précisément.
      Aucune page publiée à ce jour.

  # ── couche 03 · exécution ──────────────────────────────────────────────
  - nom: galahad
    couche: execution
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: actif
    ordre_construction: 1
    deploiement:
      mode: coolify
      aussi: [systemd, docker]
      compose: docker-compose.yml
      roles: [chef, guardian, traveler, claude-bridge]
      routage: [routing/Caddyfile.example, routing/traefik-dynamic.example.yml]
      systemd: deploy/systemd/galahad-docker-firewall.service
    produits_portefeuille: ["05 · Content Operations", "04 · Content Velocity System"]
    description: >-
      Moteur de procédures, décisions IA et coordination d'infrastructure sur
      serveur dédié. Rôles configurables, patrouille et travaux délégués ; le
      jugement modèle est explicite dans les procédures. Produit d'infrastructure
      autonome et moyen de livraison du portefeuille.
    attention: >-
      Le moteur et ses retours ont des réceptions locales ; les surfaces de
      configuration, le mandat précis, le coût persistant et l'exploitation
      multi-entreprises ne sont pas reçus. Le garde de commandes n'est pas un
      sandbox. La mémoire distante Danmem reste un service distinct.
      Voir docs/RECEPTION-GALAHAD-DANMEM.md.
    contient:
      engine: >-
        Modules — agent-loop, brain, config, goals, heartbeat, hooks,
        integrations, jobs, journal, memory, roles, skill-runner, telegram,
        tools. Zéro dépendance npm, zéro build.
      skills: [audit-coherence.json, audit-fleet.json, diagnostic-coolify.json]
      bridge: Passerelle Claude — server.js et son Dockerfile.
      cockpit: cockpit/index.html
      setup: Assistant de configuration — index.html et server.mjs.
      patrol: >-
        brain-health, deliver-watchdog, deliver, purge, prune-coolify-images,
        pilotés par galahad-patrol.cron.
      sas-admin: >-
        Passerelle Python (gateway/app.py) avec émission et révocation de
        jetons, et fermeture de ports. Le sas de sécurité du VPS.
      fable: Intégration Fable par cron.
      dan-hermes: compose, admin_mcp.py, SOUL.md.

  - nom: radar
    couche: execution
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    ordre_construction: 2
    deploiement: {mode: docker, port: 3000, requiert: postgres, front: "briefs/ (_headers, _redirects)"}
    produits_portefeuille: ["03 · Transformation Pilot", "05 · Content Operations"]
    description: >-
      Tracker de tâches auto-hébergeable. Backend Node en stdlib, API façon
      PostgREST sur Postgres, flux RSS et JSON, ingestion des retours clients
      par LLM local, trois niveaux d'autorité.
    contient:
      tables: [briefs, clients, client_markets, client_contacts, task_events, comments, brief_assets, app_config]
      front: >-
        dashboard, direction, entrees, equipe, faits, gabarits, gantt, gel,
        archive, bilan — plus les fontes Familjen Grotesk, Hanken Grotesk et
        JetBrains Mono.
    contrat_central: >-
      task_events est le journal. Le producteur émet le mouvement dans la
      transaction du brief ; les intégrations modifient le dossier, sans
      réécrire sa trace. L'état saisi ne prouve ni livraison ni accord client.
      La confidentialité historique inconnue reste signalée et non publiée.
    attention: >-
      Reste autonome. Une instance = une équipe = une base. L’installation
      Matanga garde son portail client, ses accords par visuel et ses créneaux ;
      elle est distincte de l’installation personnelle. Le journal partage son
      contrat, pas ses données. L'admission La Barre est configurée par instance
      et client, avec reçu atomique ; filtres multimarques, autres créateurs,
      réception native et retour des résultats restent à recevoir.

  - nom: talos
    couche: execution
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: fige
    deploiement: {mode: systemd, unite: ops/talos.service, installateur: ops/install.sh}
    description: >-
      Gardien de l’installation : observer la santé, diagnostiquer les incidents
      et préparer des réparations sous autorité. Son rôle reste distinct de
      l’exploration et des décisions métier.
    contient:
      src: [agent-loop, config, cron, heartbeat, hooks, index, journal, mcp, memory, ollama, soul, telegram, tools]
      radar-mcp: Pont MCP vers radar — index.js et test-client.mjs.
      memory-seed: [MEMORY.md, infra.md, projets.md]
    divergence: {avec: hulysse, chemin: src, mesure_pct: 17, le: 2026-09-14}   # SHK-0003
    attention: >-
      La divergence déclarée mesure les dépôts historiques, pas le code servi.
      Les services Talos et Hulysse utilisent une variante commune de Galahad.
      Missions et Agora sont réintégrées au canon ; cron, briefing, sessions
      persistées et MCP restent des capacités donneuses à recevoir.
      Aucun service actif migré. Voir docs/RECEPTION-TALOS-HULYSSE.md.

  - nom: hulysse
    couche: execution
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: fige
    deploiement: {mode: systemd, unite: ops/hulysse.service, installateur: ops/install.sh}
    description: >-
      Explorateur de l’installation et de ses objectifs : observer, préparer
      et remettre des pistes au domaine compétent. La politique de veille et
      l’autorité d’action doivent être explicites pour chaque installation.
    contient:
      src: [agent-loop, config, goals, hooks, index, journal, memory, telegram, tools]
      memory-seed: [MEMORY.md, infra.md, projets.md]
    divergence: {avec: talos, chemin: src, mesure_pct: 17, le: 2026-09-14}   # SHK-0003
    attention: >-
      Dépôt historique et moteur servi diffèrent. Les objectifs clos de l’ancien
      schéma restent clos dans le moteur corrigé. Veille réactive et fenêtre
      nocturne ne sont pas assimilées sans réception de configuration.
      Convergence de déploiement et reprise des conversations ouvertes.
      Voir docs/RECEPTION-TALOS-HULYSSE.md.

  - nom: danmem
    couche: execution
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: systemd, entree: src/index.mjs, requiert: postgres}
    description: >-
      Mémoire contextuelle partagée : observations attribuées, rappel hybride,
      cartes, dérivation et historique de consolidation. File de travaux entre
      mandataires. Ce contexte ne remplace ni une source métier ni son approbation.
    attention: >-
      Service HTTP et PostgreSQL distinct du moteur Galahad. La version servie
      et le canon ont été rapprochés ; schéma et contrats sont versionnés.
      Les corrections reçues sur copies ne sont pas livrées au service actif.
      Identités de mandataires, reprise des claims, coût et restauration complète
      restent ouverts. Voir docs/RECEPTION-GALAHAD-DANMEM.md.

  - nom: hermes-cockpit
    couche: execution
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    deploiement:
      mode: coolify
      port: 3000
      compose: docker-compose.yaml
      pid_host: true
      capacites: [SYS_PTRACE]
      redeploiement: ops/redeploy.sh
    description: >-
      Cockpit d'exploitation du VPS. Lit la santé de radar et de danmem,
      détecte les process Talos et Claude sur l'hôte, et sert un portail
      client. portal.mjs en tout et pour tout.
    attention: >-
      galahad porte déjà cockpit/index.html. Deux cockpits coexistent sans que
      leur partage de responsabilité soit écrit.

  # ── couche 04 · outils métier ──────────────────────────────────────────
  - nom: la-barre
    couche: tools
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    ordre_construction: 4
    deploiement: {mode: statique, entree: index.html, serveur_optionnel: servir.mjs, url: "https://labarre.powerupgraders.com/"}
    produits_portefeuille: ["03 · Transformation Pilot", "04 · Content Velocity System"]
    description: >-
      Le poste de travail du directeur de la création. Du brief au livrable, et
      les talents qui les font. Le bureau réunit une pièce, sa version, son brief
      et ses critères ; les décisions portent les retours et les engagements.
      Application autonome, sans compte, avec export JSON.
    contient:
      domaine: >-
        Modèle métier complet en français — amorce, annotation, avis, axe,
        bilan, chaine-brief, compilateur, demande, dispositif, ecarts, etats,
        jurisprudence, priorite, production, regles, renvoi, retroplanning,
        trace, validation, vault, verdict-cout, version.
      vues: >-
        atelier, attentes, bigidea, brief, constater, cycle, decider,
        direction, equipe, findemois, jurisprudence, livrable, maison,
        matrice, pipeline, pistes, placer, planche.
    parcours: docs/LA-BARRE.md
    manque: >-
      Le transfert ADVE vers le brief et la boucle de résultats vers Argos
      restent manuels. Le registre Radar ne constitue pas une synchronisation
      des décisions dans Radar avec leur trace.
    pepite: >-
      app/vue-matrice.js implémente la matrice support × marché en trois
      lectures — calendrier, mur, grille — avec mémoire du mode par dossier.
      app/ecarts.js classe les écarts par origine et dit qui doit la reprise et
      si elle se facture. C'est la pièce la plus démonstrative du programme.

  - nom: Argos-studio
    couche: tools
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: relance-prioritaire
    ordre_construction: 6
    deploiement: {mode: vercel, racine: app, aussi: workers}
    stack: [next, prisma, tailwind, biome]
    produits_portefeuille: ["02 · Creative Operations Audit"]
    source_partagee: {produit: argos, role: canonique}   # SHK-0002
    description: >-
      Bibliothèque canonique autonome d'opérations, actifs, preuves et filiations,
      avec recherche et admission manuelle. Le corpus bootstrap et la veille sur
      fixtures ne prouvent pas une couverture vivante. La Fusée gouverne l'usage
      de références par une marque ; sa projection existante consomme le contrat
      du studio. Le MCP et la boucle de résultats restent à recevoir.
    manque: >-
      Authentification de l'admission, isolation des consultations privées,
      provenance/licence par actif, amendements concurrents, réception native
      et lecture canonique depuis la Fusée. La revue des corrections et la
      boucle de résultats restent ouvertes ; voir docs/RECEPTION-ARGOS.md.

  - nom: charadesign-generator
    couche: tools
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: gele
    ordre_construction: 6
    deploiement: {mode: statique, racine: lsi-cd-app, stack: vite, entree: index.html}
    description: >-
      Atelier LSI-CD : progression de jugement sémantique, de l'archétype au
      master et aux vues. Bibliothèque, brouillon et checkpoints existants.
    manque: >-
      Persistance et orchestration corrigées sur fixtures et en CI ; réception
      native, propriété des écritures après navigation, arrêt des retours tardifs,
      import compatible et disponibilité des API de production encore ouverts.
      Voir docs/RECEPTION-ATELIERS-SPECIALISES.md.

  - nom: generateur-approches
    couche: tools
    etage: verse
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: statique, entree: index.html}
    description: Générateur d'approches publicitaires. Sans API ni dépendance externe.

  - nom: character-engine
    couche: tools
    etage: verse
    maturite: partiel
    licence: proprietaire
    vitalite: gele
    deploiement: {mode: statique, entree: character_engine.html}
    description: >-
      Moteur autonome de contraintes de direction artistique pour un personnage,
      sans nom ni récit générés. Le HTML embarque son schéma ; la bibliothèque
      externe apporte les valeurs, mais aucun profil n'est présent dans le canon.
    manque: >-
      Contradictions manuelles non qualifiées, prompt tronqué et absence de
      conservation/export du vecteur. Préciser les ancres d'interprétation avant
      factorisation. Voir docs/RECEPTION-ATELIERS-SPECIALISES.md.

  - nom: datacollector
    couche: tools
    etage: verse
    maturite: partiel
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: statique, entree: index.html, serveur: server.py, requiert: requirements.txt}
    description: >-
      Acquérir des observations publiques hétérogènes, avec leur périmètre,
      leur date et leurs erreurs. CLI et serveur Python partagent le même reçu ;
      l'interface remet ce reçu, sans en déduire une santé ou une décision de marque.
    attention: >-
      Front HTML et backend Flask distincts ; aucun Dockerfile dans le dépôt.
      Les sources réseau et leurs accès restent nécessaires. Raccord métier
      vers Seshat/Argos, navigateur, fournisseurs et exploitation TPE à recevoir.

# ── dérivés non canon ───────────────────────────────────────────────────
# Des skills Claude encodent une partie de la méthode. Elles N'ONT PAS suivi
# l'évolution du programme : ce sont des copies figées, pas des sources.
#
# Elles n'entrent donc PAS dans la flotte. Les y verser ferait exactement ce que
# SHK-0002 interdit — deux porteurs d'une même source, sans propriétaire désigné.
# Le dépôt nommé `canon` fait foi ; la skill est en retard par construction.
#
# Elles sont listées ici pour une seule raison : sans cela elles sont invisibles
# à tout. L'audit n'inspecte que des dépôts GitHub, et une skill vivant dans un
# compte Claude n'est vue par aucun des douze signaux. C'est l'angle mort connu
# du dispositif, et le déclarer est la seule chose qu'on puisse en faire.
derives_non_canon:
  - {nom: adve-cult-marketing,             ou: compte-claude, canon: ADVE-project}
  - {nom: charadesign-lsi-cd,              ou: compte-claude, canon: charadesign-generator,
     note: "existe aussi en zip local non versionné : 03 OUTILS & DEV/charadesign-lsi-cd.skill"}
  - {nom: go-to-market-strategy,           ou: compte-claude, canon: ADVE-project}
  - {nom: strategic-annual-planning,       ou: compte-claude, canon: ADVE-project}
  - {nom: kv-ooh-expert,                   ou: compte-claude, canon: la-barre}
  - {nom: advertising-key-visual-director, ou: disque-non-versionne, canon: la-barre,
     note: "03 OUTILS & DEV/0 ADVE PROJECT DOC/advertising-key-visual-director/SKILL.md"}
  - {nom: kubo-titling,                    ou: compte-claude, canon: la-fusee-blueprint}
  - {nom: xtincell-voice,                  ou: compte-claude, canon: hors-programme,
     note: "voix personnelle, pas la méthode — aucun dépôt ne la porte ni ne doit la porter"}
  - {nom: xtincell-sparring-partner,       ou: compte-claude, canon: hors-programme}
  - {nom: iris,                            ou: disque-non-versionne, canon: hors-programme,
     note: "~/.claude/skills/iris — suivi opérationnel personnel"}

# ── lignées archivées ───────────────────────────────────────────────────
# Portent le topic shinkiro pour l'historique, hors flotte vivante.
# Clé historique conservée pour les lecteurs. Leur classement ne clôture pas
# l'audit intégral : capacités donneuses et branches restent à qualifier avant
# toute décision de récupération ou d'archivage. ADVE-project est le canon actif.
lignees_mortes:
  - {nom: LaFusee_ADVE,    note: "Lignée historique : doctrine et capacités à confronter au canon actif avant toute décision d'archivage."}
  - {nom: ADVE_v8,         note: "branche par défaut claude/la-fusee-v2-rebuild-9omp5v, pas main. Dockerfile, CI, 7 migrations."}
