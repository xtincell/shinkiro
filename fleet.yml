# Shinkiro — manifeste de flotte : LE JUGEMENT
#
# Ce fichier est écrit à la main et n'est jamais généré. Il porte ce qu'aucune
# API ne sait dire : à quoi sert un composant, dans quel ordre le construire, ce
# à quoi il faut faire attention.
#
# Les FAITS vivent dans fleet.lock.yml, régénéré par `make releve` : volumétrie,
# topics, licence effective, branche, artefacts de déploiement, commits sur 90 j.
# Un fichier qui prétend énoncer des faits doit les recalculer, sinon il ment.
#
# La tension entre les deux EST l'audit. Trois champs d'ici sont des jugements
# que le .lock peut contredire, et cette contradiction est un signal de dérive :
#
#   vitalite: actif        contredit par  commits_90j: 0
#   licence: mit           contredit par  licence: ABSENTE
#   deploiement.mode       contredit par  artefacts (mode vercel sans next.config)
#
# etage
#   reference  composant autonome : son dépôt, son cycle, son déploiement.
#   verse      outil léger : dépôt propre + submodule sous tools/.
#
# maturite   produit | utilisable | partiel | a-qualifier | gele
# vitalite   actif | gele | fige | relance-prioritaire   (commits sur 90 j)
#
# deploiement.mode — constaté, pas supposé :
#   coolify   compose piloté par Coolify sur le VPS (Traefik + TLS par FQDN)
#   systemd   unité .service installée sur l'hôte
#   docker    Dockerfile autonome, orchestration libre
#   vercel    application Next en PaaS
#   pages     statique servi par GitHub Pages
#   statique  HTML ouvrable sans serveur
#   document  ni service ni page : méthode, gabarits, doctrine
#   module    ne se déploie pas seul, passe par son hôte
#
# deploiement.racine — sous-dossier du point d'entrée quand il n'est pas à la
# racine. Trois composants sont dans ce cas ; sans ce champ, un agent les croit
# non déployables.

owner: xtincell
version: 2
programme: shinkiro        # ce dépôt-ci : il porte le manifeste, il n'y figure pas
plateforme_vps: coolify        # galahad patrouille et purge ses images ;
                               # hermes-cockpit s'y déploie ; galahad porte une
                               # skill diagnostic-coolify.json

composants:

  # ── couche 01 · méthode ────────────────────────────────────────────────
  - nom: ADVE-project
    couche: method
    etage: reference
    maturite: produit
    licence: proprietaire
    vitalite: actif
    ordre_construction: 5
    deploiement: {mode: vercel, url: "https://lafusee-app.vercel.app"}
    stack: [next, prisma, typescript, storybook, playwright]
    produits_portefeuille: ["07 · Creative Transformation Program", "02 · Creative Operations Audit"]
    source_partagee: {produit: argos, role: client, via: "POST /api/v1/ingest/dossier"}   # SHK-0002
    description: >-
      La Fusée v6.19 — Industry OS du marché créatif africain, et dépôt
      canonique de la méthode ADVE. Un brief entre en PDF, le diagnostic tombe
      en quinze minutes, la stratégie est écrite sous 48 h.
    attention: >-
      Le plus lourd et le plus strict du programme. Gouvernance à 192 ADR, un
      plugin ESLint maison, dix PR ouvertes. Ne jamais commencer par lui.

  - nom: la-fusee-blueprint
    couche: method
    etage: reference
    maturite: produit
    licence: proprietaire
    vitalite: gele
    deploiement: {mode: statique, racine: views, entree: LA_FUSEE_PHILO_VIEW.html}
    description: >-
      Le canon conceptuel. LA_FUSEE_BLUEPRINT.md (146 Ko) est la source de
      vérité unique : neuf livres cosmogoniques, chacun lisible en trois voix
      entrelacées. Plus un cahier des charges de 120 Ko et cinq archives.
    attention: Doctrine, pas code. Ne pas chercher à l'exécuter.

  - nom: indice-maturite
    couche: method
    etage: verse
    maturite: produit
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: pages, url: "https://xtincell.github.io/indice-maturite/", entree: index.html}
    produits_portefeuille: ["01 · Creative Opportunity Check"]
    description: >-
      Le diagnostic d'entrée. Seize questions, quatre axes, un niveau de 0 à 5,
      et une prescription. Seul produit du catalogue où l'outil est l'offre.

  - nom: market-expansion-system
    couche: method
    etage: verse
    maturite: produit
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: document}
    produits_portefeuille: ["06 · Content Expansion Modules"]
    description: >-
      Décliner une campagne d'un marché à N marchés sans perdre la marque.
      Quatre types d'écart autorisés — langue, marque, SKU, réglementaire.
      Preuve terrain : neuf marchés, bascule de marque et de langue au Ghana.
    voir_aussi: >-
      la-barre implémente déjà la matrice support × marché (app/vue-matrice.js)
      et une taxonomie d'écarts complémentaire (app/ecarts.js, cinq origines :
      qui doit la reprise et si elle se facture). Les deux modèles ne sont pas
      reliés — c'est un chantier ouvert, pas un doublon.

  # ── couche 02 · entreprise ─────────────────────────────────────────────
  - nom: galahad-landing
    couche: company
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: actif
    deploiement: {mode: docker, entree: index.html}
    description: Page produit de galahad. Dockerfile plus un index.html.
    attention: >-
      Le « à trancher » est tranché, et par le fichier lui-même : zéro occurrence
      de Shinkiro, d'ADVE, de La Fusée, de Radar ou de La Barre ; 26 de « agent »,
      10 de « VPS », 8 de « Telegram ». C'est bien la page de galahad.
      Mais elle s'adresse au MAUVAIS ACHETEUR — « self-hosted team of autonomous
      AI agents », « self-host in 60 seconds », écrit pour un développeur qui
      veut auto-héberger. Le produit s'adresse à un patron d'agence qui veut que
      sa boîte tourne sans lui. Elle vend la technologie au lieu du résultat,
      ce que la règle de nommage du portefeuille interdit précisément.
      Aucune page publiée à ce jour.

  # ── couche 03 · exécution ──────────────────────────────────────────────
  - nom: galahad
    couche: execution
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    ordre_construction: 1
    deploiement:
      mode: coolify
      aussi: [systemd, docker]
      compose: docker-compose.yml
      roles: [chef, guardian, traveler, claude-bridge]
      routage: [routing/Caddyfile.example, routing/traefik-dynamic.example.yml]
      systemd: deploy/systemd/galahad-docker-firewall.service
    produits_portefeuille: ["05 · Content Operations", "04 · Content Velocity System"]
    description: >-
      Une équipe d'IA organisée en agents qui fait tourner l'agence en autonomie
      depuis un serveur dédié. Coordonnés sur un seul VPS, pilotés depuis
      Telegram, agnostiques au fournisseur de modèle. Une image, trois rôles.
      C'est un PRODUIT du portefeuille, pas seulement un composant de livraison.
    contient:
      engine: >-
        15 modules — agent-loop, brain, config, goals, heartbeat, hooks,
        integrations, jobs, journal, memory, roles, skill-runner, telegram,
        tools. Zéro dépendance npm, zéro build.
      skills: [audit-coherence.json, diagnostic-coolify.json]
      bridge: Passerelle Claude — server.js et son Dockerfile.
      cockpit: cockpit/index.html
      setup: Assistant de configuration — index.html et server.mjs.
      patrol: >-
        brain-health, deliver-watchdog, deliver, purge, prune-coolify-images,
        pilotés par galahad-patrol.cron.
      sas-admin: >-
        Passerelle Python (gateway/app.py) avec émission et révocation de
        jetons, et fermeture de ports. Le sas de sécurité du VPS.
      fable: Intégration Fable par cron.
      dan-hermes: compose, admin_mcp.py, SOUL.md.

  - nom: radar
    couche: execution
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    ordre_construction: 2
    deploiement: {mode: docker, port: 3000, requiert: postgres, front: "briefs/ (_headers, _redirects)"}
    produits_portefeuille: ["03 · Transformation Pilot", "05 · Content Operations"]
    description: >-
      Tracker de tâches auto-hébergeable. Backend Node en stdlib, API façon
      PostgREST sur Postgres, flux RSS et JSON, ingestion des retours clients
      par LLM local, trois niveaux d'autorité.
    contient:
      tables: [briefs, clients, client_markets, client_contacts, task_events, comments, brief_assets, app_config]
      front: >-
        dashboard, direction, entrees, equipe, faits, gabarits, gantt, gel,
        archive, bilan — plus les fontes Familjen Grotesk, Hanken Grotesk et
        JetBrains Mono.
    contrat_central: >-
      task_events est le journal. Toute intégration qui modifie un brief doit y
      écrire son événement, sinon la mesure avant/après se perd — et avec elle
      le sixième critère de gouvernance du portefeuille.
    attention: Reste autonome. Une instance = une équipe = une base.

  - nom: talos
    couche: execution
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: fige
    deploiement: {mode: systemd, unite: ops/talos.service, installateur: ops/install.sh}
    description: >-
      Rôle Guardian — gardien du VPS. Refondu sur l'Agent SDK : le cerveau
      agentique est délégué au moteur, Talos n'écrit que la mémoire stratifiée,
      la patrouille, le canal, le journal, et câble les garde-fous en dur.
    contient:
      src: [agent-loop, config, cron, heartbeat, hooks, index, journal, mcp, memory, ollama, soul, telegram, tools]
      radar-mcp: Pont MCP vers radar — index.js et test-client.mjs.
      memory-seed: [MEMORY.md, infra.md, projets.md]
    divergence: {avec: hulysse, chemin: src, mesure_pct: 17, le: 2026-09-14}   # SHK-0003
    attention: >-
      Même moteur que hulysse, à 17 % près — journal.js, ollama.js et telegram.js
      sont identiques à l'octet. Ce qui les sépare est fonctionnel, pas structurel :
      talos porte cron, heartbeat et le pont MCP vers radar ; hulysse porte goals et
      veille. C'est la duplication réelle du programme, et la seule.
      Aucun recouvrement avec galahad, qui diverge de 73 % : moteur différent,
      agnostique au fournisseur de modèle. Chiffres reproductibles par
      scripts/mesure-divergence.mjs.

  - nom: hulysse
    couche: execution
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: fige
    deploiement: {mode: systemd, unite: ops/hulysse.service, installateur: ops/install.sh}
    description: >-
      Rôle Traveler — explorateur autonome et bâtisseur de nuit. Veille,
      objectifs, repli LLM. Demande avant de livrer.
    contient:
      src: [agent-loop, config, goals, hooks, index, journal, memory, telegram, tools]
      memory-seed: [MEMORY.md, infra.md, projets.md]
    divergence: {avec: talos, chemin: src, mesure_pct: 17, le: 2026-09-14}   # SHK-0003
    attention: >-
      Même moteur que talos. Voir talos.attention — et non galahad, dont il
      diverge de 71 %.

  - nom: danmem
    couche: execution
    etage: reference
    maturite: a-qualifier
    licence: proprietaire
    vitalite: fige
    deploiement: {mode: module, hote: galahad}
    description: >-
      Serveur de mémoire homebrew — peers, deriver, dialectique, S0→S7. Un
      seul fichier de code, src/index.mjs.
    attention: >-
      Aucun README. Et galahad/engine/src/memory.js couvre déjà une couche
      mémoire : le rapport entre les deux n'est établi nulle part.

  - nom: hermes-cockpit
    couche: execution
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    deploiement:
      mode: coolify
      port: 3000
      compose: docker-compose.yaml
      pid_host: true
      capacites: [SYS_PTRACE]
      redeploiement: ops/redeploy.sh
    description: >-
      Cockpit d'exploitation du VPS. Lit la santé de radar et de danmem,
      détecte les process Talos et Claude sur l'hôte, et sert un portail
      client. portal.mjs en tout et pour tout.
    attention: >-
      galahad porte déjà cockpit/index.html. Deux cockpits coexistent sans que
      leur partage de responsabilité soit écrit.

  # ── couche 04 · outils métier ──────────────────────────────────────────
  - nom: la-barre
    couche: tools
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: actif
    ordre_construction: 4
    deploiement: {mode: statique, entree: index.html, serveur_optionnel: servir.mjs}
    produits_portefeuille: ["03 · Transformation Pilot", "04 · Content Velocity System"]
    description: >-
      Le poste de travail du directeur de la création. Du brief au livrable, et
      les talents qui les font. Aucun serveur, aucun compte : on double-clique.
    contient:
      domaine: >-
        Modèle métier complet en français — amorce, annotation, avis, axe,
        bilan, chaine-brief, compilateur, demande, dispositif, ecarts, etats,
        jurisprudence, priorite, production, regles, renvoi, retroplanning,
        trace, validation, vault, verdict-cout, version.
      vues: >-
        atelier, attentes, bigidea, brief, constater, cycle, decider,
        direction, equipe, findemois, jurisprudence, livrable, maison,
        matrice, pipeline, pistes, placer, planche.
    pepite: >-
      app/vue-matrice.js implémente la matrice support × marché en trois
      lectures — calendrier, mur, grille — avec mémoire du mode par dossier.
      app/ecarts.js classe les écarts par origine et dit qui doit la reprise et
      si elle se facture. C'est la pièce la plus démonstrative du programme.

  - nom: Argos-studio
    couche: tools
    etage: reference
    maturite: partiel
    licence: proprietaire
    vitalite: relance-prioritaire
    ordre_construction: 6
    deploiement: {mode: vercel, racine: app, aussi: workers}
    stack: [next, prisma, tailwind, biome]
    produits_portefeuille: ["02 · Creative Operations Audit"]
    source_partagee: {produit: argos, role: canonique}   # SHK-0002
    description: >-
      La plus grande bibliothèque qualifiée de campagnes — répertoire éditorial
      de patterns créatifs, exploitable en moteur de recherche public ou via
      API et MCP. Données réelles en place : dossiers Apple 1984, Think
      Different, Get a Mac, Nike Just Do It, Dream Crazy, Find Your Greatness,
      Patagonia.
    manque: >-
      La boucle de mesure reliant la bibliothèque aux résultats client. Sans
      elle, le module reste un catalogue et le produit 05 n'est pas vendable.

  - nom: charadesign-generator
    couche: tools
    etage: reference
    maturite: utilisable
    licence: proprietaire
    vitalite: gele
    ordre_construction: 6
    deploiement: {mode: statique, racine: lsi-cd-app, stack: vite, entree: index.html}
    description: >-
      Pipeline LSI-CD v3.4 de bout en bout — de l'archétype triangulé à la
      sortie multi-vues. Tracker en neuf étapes, UI Atelier clair.

  - nom: generateur-approches
    couche: tools
    etage: verse
    maturite: utilisable
    licence: proprietaire
    vitalite: gele
    deploiement: {mode: statique, entree: index.html}
    description: Générateur d'approches publicitaires. Sans API ni dépendance externe.

  - nom: character-engine
    couche: tools
    etage: verse
    maturite: utilisable
    licence: proprietaire
    vitalite: gele
    deploiement: {mode: statique, entree: character_engine.html}
    description: >-
      Moteur de character design. schema.json définit 48 paramètres et les
      règles de direction artistique ; variables.json (36 Ko) porte les profils
      et bibliothèques. Guides V3, V4, variables, compatibilité et installation.

  - nom: datacollector
    couche: tools
    etage: verse
    maturite: utilisable
    licence: proprietaire
    vitalite: gele
    deploiement: {mode: docker, entree: index.html, serveur: server.py, requiert: requirements.txt}
    description: >-
      Collecte multi-sources pour l'intelligence marketing. Front HTML plus un
      serveur Python. Développé pour UPGRADERS SARL.

# ── dérivés non canon ───────────────────────────────────────────────────
# Des skills Claude encodent une partie de la méthode. Elles N'ONT PAS suivi
# l'évolution du programme : ce sont des copies figées, pas des sources.
#
# Elles n'entrent donc PAS dans la flotte. Les y verser ferait exactement ce que
# SHK-0002 interdit — deux porteurs d'une même source, sans propriétaire désigné.
# Le dépôt nommé `canon` fait foi ; la skill est en retard par construction.
#
# Elles sont listées ici pour une seule raison : sans cela elles sont invisibles
# à tout. L'audit n'inspecte que des dépôts GitHub, et une skill vivant dans un
# compte Claude n'est vue par aucun des douze signaux. C'est l'angle mort connu
# du dispositif, et le déclarer est la seule chose qu'on puisse en faire.
derives_non_canon:
  - {nom: adve-cult-marketing,             ou: compte-claude, canon: ADVE-project}
  - {nom: charadesign-lsi-cd,              ou: compte-claude, canon: charadesign-generator,
     note: "existe aussi en zip local non versionné : 03 OUTILS & DEV/charadesign-lsi-cd.skill"}
  - {nom: go-to-market-strategy,           ou: compte-claude, canon: ADVE-project}
  - {nom: strategic-annual-planning,       ou: compte-claude, canon: ADVE-project}
  - {nom: kv-ooh-expert,                   ou: compte-claude, canon: la-barre}
  - {nom: advertising-key-visual-director, ou: disque-non-versionne, canon: la-barre,
     note: "03 OUTILS & DEV/0 ADVE PROJECT DOC/advertising-key-visual-director/SKILL.md"}
  - {nom: kubo-titling,                    ou: compte-claude, canon: la-fusee-blueprint}
  - {nom: xtincell-voice,                  ou: compte-claude, canon: hors-programme,
     note: "voix personnelle, pas la méthode — aucun dépôt ne la porte ni ne doit la porter"}
  - {nom: xtincell-sparring-partner,       ou: compte-claude, canon: hors-programme}
  - {nom: iris,                            ou: disque-non-versionne, canon: hors-programme,
     note: "~/.claude/skills/iris — suivi opérationnel personnel"}

# ── lignées archivées ───────────────────────────────────────────────────
# Portent le topic shinkiro pour l'historique, hors flotte vivante.
# ADVE-project est canonique ; ces cinq sont des lignées mortes de la méthode.
lignees_mortes:
  - {nom: LaFusee_ADVE,    note: "vercel.json présent — a été déployé. Son README est meilleur que celui du canonique : à récupérer avant archivage."}
  - {nom: ADVE_v8,         note: "branche par défaut claude/la-fusee-v2-rebuild-9omp5v, pas main. Dockerfile, CI, 7 migrations."}
  - {nom: AVERTIS_web_v01, note: "application complète sous advertis-app/ — next, prisma, seeds ARTEMIS. Coquille dans le nom du dépôt."}
  - {nom: ADVERTIS_v01,    note: "8-Pillar Brand Strategy System. Lignée antérieure."}
  - {nom: ADVERT_01,       note: "première tentative de produit. 111 modifications non commitées dans le clone local."}

# ── hors flotte ─────────────────────────────────────────────────────────
# Ne jamais cloner avec make clone-all. Voir docs/CLOISON.md.
hors_perimetre:
  employeur: [Matanga-Creative-dashboard, matanga-hermes-mcp, ADVERTIS-Matanga]
  client:    [spawt-meute-quiz, spawt-ci-mobile-v1-mvp, project_spawt, project_spawt_mobile_ci]
  labo:      [neo-kinara, 15B_Stories, atlas-of-recorded-sound, CosmicMachine, Tauri-v1, BlackNoteWeb]
  adjacent:  [Folio_Spark]
  archives:  [ADVERT-web, BrandForge]
