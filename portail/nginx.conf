server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Les liens du portail sont écrits avec leur extension : pas de réécriture.
  location / { try_files $uri $uri/ =404; }

  # source.json porte l'empreinte du manifeste : il ne doit jamais être servi
  # depuis un cache, sinon le contrôle de fraîcheur juge une version périmée.
  location = /source.json { add_header Cache-Control "no-store"; }

  location ~* \.(css|js|svg|woff2)$ { expires 1h; add_header Cache-Control "public"; }

  gzip on;
  gzip_types text/html text/css application/json application/javascript;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
